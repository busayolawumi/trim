<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 24 24">
  <!-- Open scissors (for "trim"): handles in the logo's emerald, blades white on dark tab bars
       and near-black on light ones. Drawn on a 24px grid (handles left, blades right), scaled
       to fit; the viewBox crops to the scissors. -->
  <style>
    @media (prefers-color-scheme: light) {
      .blades { stroke: #18181b; }
    }
  </style>
  <g transform="translate(3.35 2.8) scale(1.1)" fill="none" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path class="blades" d="M20 4 8.12 15.88M8.12 8.12 12 12M14.8 14.8 20 20" stroke="#fff" />
    <circle cx="6" cy="6" r="3" stroke="#10b981" />
    <circle cx="6" cy="18" r="3" stroke="#10b981" />
  </g>
</svg>
